---
layout: default
---

<div class="home">


  {{ content }}

  {%- if site.posts.size > 0 -%}
    <ul class="post-list">
      {%- for post in site.posts -%}
      <li>
        <h3>
          <a class="post-link" href="{{ post.url | relative_url }}">
            <b>{{ post.title | escape }}</b>
          </a>
        </h3>
        {%- if site.show_excerpts -%}
          {{ post.excerpt }}
        {%- endif -%}
      </li>
      {%- endfor -%}
    </ul>

    <p class="rss-subscribe"><i>subscribe <a href="{{ "/feed.xml" | relative_url }}">via RSS</a></i></p>
  {%- endif -%}

</div>
